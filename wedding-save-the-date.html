<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Save the Date | Tiger Town</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="paint-canvas"></canvas>
  <div id="cursor"></div>

  <main class="page">
    <nav class="nav">
      <a href="index.html" class="logo">
        <img src="" alt="Tiger Town">
      </a>
    </nav>

    <div class="project-header">
      <div class="project-category">STUDIO</div>
      <h1 class="project-title">Wedding Save the Date</h1>
      <p class="project-intro">Garth and Jen created a felt stop motion video for their wedding save the date. They designed the scenes in vector format, laser cut all the felt, and then Garth meticulously animated the entire video, scene by scene. Their kitty was the third helper.</p>
    </div>

    <div class="project-hero">
      <div class="hero-single" data-index="0">
        <img src="images/felt-show/IMG_6978.jpg" alt="Felt Show">
      </div>
    </div>

    <div class="photo-grid loading" id="photo-grid">
      <img class="grid-img" src="images/felt-show/IMG_6969.jpg" data-index="1" alt="" loading="lazy">
      <img class="grid-img" src="images/felt-show/IMG_6974.jpg" data-index="2" alt="" loading="lazy">
      <img class="grid-img" src="images/felt-show/IMG_6971.jpg" data-index="3" alt="" loading="lazy">
      <img class="grid-img" src="images/felt-show/IMG_6976.jpg" data-index="4" alt="" loading="lazy">
      <img class="grid-img" src="images/felt-show/IMG_6962.jpg" data-index="5" alt="" loading="lazy">
    </div>

    <div class="bottom-nav"></div>

    </main>

  </div>

  <script src="main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      
      // ── SCROLL REVEAL ──
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const row = entry.target.parentElement;
            const siblings = row ? Array.from(row.children) : [entry.target];
            const idx = siblings.indexOf(entry.target);
            setTimeout(() => entry.target.classList.add('revealed'), idx * 60);
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.hero-single, .hero-duo-item').forEach(el => {
        el.classList.add('revealed');
      });

      function observeGridItems() {
        document.querySelectorAll('.grid-item').forEach(el => revealObserver.observe(el));
      }

      // ── JUSTIFIED GRID ──
      const ROW_HEIGHT = 280;
      const grid = document.getElementById('photo-grid');
      const rawImgs = Array.from(grid.querySelectorAll('.grid-img'));

      function containerWidth() { return grid.getBoundingClientRect().width; }
      function getGap() { return window.innerWidth <= 580 ? 6 : 14; }

      function buildGrid(images) {
        const W = containerWidth();
        const GAP = getGap();
        grid.innerHTML = '';
        grid.classList.remove('loading');
        const ratios = images.map(img => img.naturalWidth / img.naturalHeight || 1.5);
        let i = 0;
        while (i < images.length) {
          let best = 1;
          for (let j = 1; j <= images.length - i; j++) {
            const slice = ratios.slice(i, i + j);
            const sumR = slice.reduce((a, b) => a + b, 0);
            const scale = (W - (j - 1) * GAP) / (sumR * ROW_HEIGHT);
            const rowH = ROW_HEIGHT * scale;
            best = j;
            if (rowH < ROW_HEIGHT * 0.72) { best = j - 1; break; }
          }
          if (best < 1) best = 1;
          const slice = ratios.slice(i, i + best);
          const sliceImgs = images.slice(i, i + best);
          const sumR = slice.reduce((a, b) => a + b, 0);
          const gaps = (best - 1) * GAP;
          const isLast = (i + best >= images.length);
          const lastRowW = sumR * ROW_HEIGHT + gaps;
          const rowH = isLast && lastRowW <= W ? ROW_HEIGHT : (W - gaps) / sumR;
          const row = document.createElement('div');
          row.className = 'grid-row';
          sliceImgs.forEach((img, k) => {
            const itemW = Math.floor(ratios[i + k] * rowH);
            const item = document.createElement('div');
            item.className = 'grid-item';
            item.style.width = itemW + 'px';
            item.style.height = Math.floor(rowH) + 'px';
            item.dataset.index = img.dataset.index;
            const imgEl = document.createElement('img');
            imgEl.src = img.src;
            imgEl.alt = '';
            item.appendChild(imgEl);
            item.addEventListener('click', () => openModal(parseInt(item.dataset.index)));
            row.appendChild(item);
          });
          grid.appendChild(row);
          i += best;
        }
        requestAnimationFrame(() => observeGridItems());
      }

      let loaded = 0;
      rawImgs.forEach(img => {
        const done = () => { loaded++; if (loaded === rawImgs.length) buildGrid(rawImgs); };
        if (img.complete) done(); else { img.addEventListener('load', done); img.addEventListener('error', done); }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => buildGrid(rawImgs), 120);
      });

      // ── MODAL ──
      const allCaptions = [];
      const allImgs = ['images/felt-show/IMG_6978.jpg', 'images/felt-show/IMG_6969.jpg', 'images/felt-show/IMG_6974.jpg', 'images/felt-show/IMG_6971.jpg', 'images/felt-show/IMG_6976.jpg', 'images/felt-show/IMG_6962.jpg'];
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modal-img');
      const modalPrev = document.getElementById('modal-prev');
      const modalNext = document.getElementById('modal-next');
      let current = 0;

      function openModal(idx) {
        current = idx; modal.classList.add('open'); document.body.style.overflow = 'hidden'; updateModal();
      }
      function closeModal() { modal.classList.remove('open'); document.body.style.overflow = ''; }
      function updateModal() {
        modalImg.src = allImgs[current];
        const cap = allCaptions[current];
        let capEl = document.getElementById('modal-caption');
        if (!capEl) {
          capEl = document.createElement('div');
          capEl.id = 'modal-caption';
          capEl.className = 'modal-caption';
          document.querySelector('.modal-img-wrap').appendChild(capEl);
        }
        capEl.textContent = cap || '';
        modalPrev.classList.toggle('hidden', current === 0);
        modalNext.classList.toggle('hidden', current === allImgs.length - 1);
      }
      function prev() { if (current > 0) { current--; updateModal(); } }
      function next() { if (current < allImgs.length - 1) { current++; updateModal(); } }

      document.querySelector('.hero-single').addEventListener('click', () => openModal(0));
      document.getElementById('modal-close').addEventListener('click', closeModal);
      modalPrev.addEventListener('click', prev);
      modalNext.addEventListener('click', next);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', (e) => {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'ArrowRight') next();
        if (e.key === 'Escape') closeModal();
      });
      let touchStartX = 0;
      modal.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive: true});
      modal.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
      });

    });
  </script>

</html>
